services:

  frontend:
    image: nginx:latest
    container_name: asta-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: asta-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  database:
    image: postgres:16
    container_name: asta-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped


volumes:
  postgres-data:
